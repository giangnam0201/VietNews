<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E53935"/>
      <stop offset="50%" style="stop-color:#FF5252"/>
      <stop offset="100%" style="stop-color:#FF6D00"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A80"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#E53935" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#grad1)"/>
  
  <!-- Inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Newspaper/feed icon - stylized V shape made of paper layers -->
  <!-- Back paper -->
  <rect x="120" y="140" width="272" height="260" rx="16" fill="rgba(255,255,255,0.2)" transform="rotate(-3 256 270)"/>
  
  <!-- Main paper -->
  <rect x="130" y="130" width="252" height="260" rx="14" fill="white" filter="url(#shadow1)"/>
  
  <!-- Header line -->
  <rect x="155" y="158" width="100" height="6" rx="3" fill="#E53935" opacity="0.9"/>
  
  <!-- Title lines -->
  <rect x="155" y="182" width="202" height="8" rx="4" fill="#1D1D1F" opacity="0.85"/>
  <rect x="155" y="200" width="170" height="8" rx="4" fill="#1D1D1F" opacity="0.6"/>
  
  <!-- Image placeholder -->
  <rect x="155" y="224" width="92" height="68" rx="8" fill="#FFE0E0"/>
  <circle cx="176" cy="248" r="8" fill="#E53935" opacity="0.4"/>
  <polygon points="160,280 195,254 210,268 235,248 247,280" fill="#E53935" opacity="0.3"/>
  
  <!-- Content lines beside image -->
  <rect x="260" y="228" width="97" height="5" rx="2.5" fill="#6E6E73" opacity="0.5"/>
  <rect x="260" y="242" width="85" height="5" rx="2.5" fill="#6E6E73" opacity="0.4"/>
  <rect x="260" y="256" width="92" height="5" rx="2.5" fill="#6E6E73" opacity="0.3"/>
  <rect x="260" y="270" width="70" height="5" rx="2.5" fill="#6E6E73" opacity="0.3"/>
  
  <!-- More content lines -->
  <rect x="155" y="308" width="202" height="5" rx="2.5" fill="#6E6E73" opacity="0.4"/>
  <rect x="155" y="322" width="185" height="5" rx="2.5" fill="#6E6E73" opacity="0.3"/>
  <rect x="155" y="336" width="160" height="5" rx="2.5" fill="#6E6E73" opacity="0.3"/>
  
  <!-- Bottom accent bar -->
  <rect x="155" y="360" width="60" height="5" rx="2.5" fill="#E53935" opacity="0.6"/>
  
  <!-- "V" letter accent on top-right corner -->
  <g transform="translate(330, 120)">
    <circle cx="25" cy="25" r="28" fill="white" opacity="0.95"/>
    <text x="25" y="34" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#E53935" text-anchor="middle">V</text>
  </g>
  
  <!-- Signal/broadcast waves on bottom-left -->
  <g transform="translate(80, 350)" opacity="0.6">
    <path d="M10 30 Q 20 10, 30 30" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M5 35 Q 20 5, 35 35" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M0 40 Q 20 0, 40 40" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  </g>
  
  <!-- Star sparkle top-left -->
  <g transform="translate(105, 105)" opacity="0.7">
    <circle cx="0" cy="0" r="3" fill="white"/>
    <rect x="-1" y="-8" width="2" height="16" rx="1" fill="white"/>
    <rect x="-8" y="-1" width="16" height="2" rx="1" fill="white"/>
  </g>
</svg>
