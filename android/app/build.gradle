plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vietnews.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vietnews.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        manifestPlaceholders = [
            hostName: "giangnam0201.github.io",
            defaultUrl: "https://giangnam0201.github.io/VietNews/",
            launcherName: "VietNews",
            assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "https://giangnam0201.github.io"}}]'
        ]
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
