name: Build and Deploy VietNews

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build web app
        run: npm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Enable GitHub Pages
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleRelease --no-daemon --stacktrace
      
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  build-electron:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Electron (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: ignore

  create-release:
    needs: [build-web, build-android, build-electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: List artifacts
        run: find ./artifacts -type f | sort
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VietNews v2.0.${{ github.run_number }}
          body: |
            ## VietNews v2.0 - All-in-One Vietnamese News Aggregator
            
            ### What's New
            - Redesigned modern UI with dark mode
            - Built-in article reader (no ads!)
            - Multiple CORS proxy fallback for reliability
            - Skeleton loading animations
            - Android APK support
            - Optimized build sizes
            
            ### Downloads
            | Platform | Link |
            |----------|------|
            | Web (PWA) | https://giangnam0201.github.io/VietNews/ |
            | Android | Download APK below |
            | Windows | Download .exe below |
            | macOS | Download .dmg below |
            | Linux | Download .AppImage below |
            
            ### Features
            - 10+ Vietnamese news sources aggregated
            - Zero ads, clean reading experience
            - Built-in article scraper/reader
            - Dark/Light mode
            - Bookmark & search
            - Filter by category/source
            - PWA installable on mobile
            - Auto-refresh every 5 minutes
          files: |
            ./artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
